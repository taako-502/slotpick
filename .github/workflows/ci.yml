name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    name: Tests & lint
    # Avoid the capacity-constrained macOS arm64 runner queue.
    runs-on: macos-26-intel
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Lint Swift
        run: xcrun swift-format lint --strict --recursive Package.swift SlotPick Sources Tests

      - name: Lint GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 5b44c3bc2255115c9b69e30efc0fecdf498fdb63c5d58e17084fd5f16324c644
        run: |
          [[ "$(uname -m)" == x86_64 ]]
          tool_dir=$(mktemp -d "$RUNNER_TEMP/actionlint.XXXXXX")
          archive="actionlint_${ACTIONLINT_VERSION}_darwin_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}" \
            -o "$tool_dir/$archive"
          (cd "$tool_dir" && echo "$ACTIONLINT_SHA256  $archive" | shasum -a 256 -c -)
          tar -xzf "$tool_dir/$archive" -C "$tool_dir" actionlint
          "$tool_dir/actionlint" -shellcheck= .github/workflows/*.yml

      - name: Check shell syntax
        run: bash -n scripts/build-dmg.sh

      - name: Test release tooling
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Test macOS application
        id: tests
        run: |
          xcodebuild -project SlotPick.xcodeproj -scheme SlotPick \
            -configuration Debug -destination "platform=macOS,arch=$(uname -m)" \
            -derivedDataPath "$RUNNER_TEMP/slotpick-tests" \
            -resultBundlePath "$RUNNER_TEMP/SlotPickTests.xcresult" test

      - name: Upload Xcode test results
        if: ${{ always() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SlotPickTests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/SlotPickTests.xcresult
          retention-days: 7
          if-no-files-found: warn
